
{% extends 'base.html' %}

{% block content %}

<style>
    .edit-page {
        padding: 30px 6%;
        min-height: 80vh;
    }

    .page-heading {
        margin-bottom: 25px;
    }

    .page-heading h1 {
        color: #283779;
        margin-bottom: 8px;
    }

    .page-heading p {
        color: #666;
    }

    .edit-container {
        max-width: 750px;
        margin: auto;
        background: #FFFFFF;
        padding: 30px;
        border-radius: 12px;
        box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }

    .edit-section {
        margin-bottom: 25px;
    }

    .edit-section h2 {
        color: #283779;
        font-size: 20px;
        padding-bottom: 12px;
        border-bottom: 1px solid #ddd;
        margin-bottom: 20px;
    }

    .form-fields p {
        margin-bottom: 18px;
    }

    .form-fields label {
        display: block;
        color: #444;
        font-weight: 600;
        margin-bottom: 8px;
    }

    .form-fields input,
    .form-fields textarea,
    .form-fields select {
        width: 100%;
        padding: 11px;
        border: 1px solid #ccc;
        border-radius: 6px;
        box-sizing: border-box;
        font-size: 15px;
        font-family: inherit;
    }

    .form-fields input:focus,
    .form-fields textarea:focus,
    .form-fields select:focus {
        outline: none;
        border-color: #283779;
    }

    .form-fields ul.errorlist {
        color: #dc3545;
        font-size: 13px;
        padding-left: 20px;
    }

    .form-actions {
        display: flex;
        gap: 12px;
        margin-top: 25px;
    }

    .save-btn,
    .cancel-btn {
        padding: 11px 25px;
        border-radius: 6px;
        text-decoration: none;
        font-size: 15px;
        cursor: pointer;
    }

    .save-btn {
        background: #283779;
        color: white;
        border: none;
    }

    .save-btn:hover {
        background: #2e4b93;
    }

    .cancel-btn {
        background: #e5e7eb;
        color: #333;
    }

    .cancel-btn:hover {
        background: #d1d5db;
    }

    @media (max-width: 600px) {
        .edit-page {
            padding: 20px 4%;
        }

        .edit-container {
            padding: 20px;
        }
    }
</style>


<div class="edit-page">

    <div class="page-heading">
        <h1>Edit Profile</h1>
        <p>Update your account and student information.</p>
    </div>


    <div class="edit-container">

        <form method="POST">

            {% csrf_token %}

            <!-- Account Information -->

            <div class="edit-section">

                <h2>Account Information</h2>

                <div class="form-fields">

                    <p>
                        <label>Username</label>
                        <input type="text"
                               value="{{ request.user.username }}"
                               readonly>
                    </p>

                    {{ user_form.as_p }}

                </div>

            </div>


            <!-- Student Information -->

            <div class="edit-section">

                <h2>Student Information</h2>

                <div class="form-fields">
                    {{ profile_form.as_p }}
                </div>

            </div>


            <!-- Buttons -->

            <div class="form-actions">

                <button type="submit" class="save-btn">
                    Save Changes
                </button>

                <a href="{% url 'my_profile' %}" class="cancel-btn">
                    Cancel
                </a>

            </div>

        </form>

    </div>

</div>

{% endblock %}
