{% extends 'base.html' %}

{% block title %}Student Registration - Stay Mate{% endblock %}
{% block content %}

<style>
  .register-container{
    min-height: 80vh;
    display:flex;
    justify-content: center;
    align-items: center;
    padding:40px 20px;
  }

  .register-card{
    background-color: white;
    width:100%;
    max-width: 500px;
    padding:30px;
    border-radius: 12px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.05);
    }

    .register-card h2{
      text-align: center;
      flex-direction: column;
      gap:7px;
      margin-bottom: 18px;
    }

    .register-card label{
      color: #334155;
      font-weight: 500;
    }

    .register-card input,
    .register-card textarea{
      padding:11px;
      border:1px solid #CBD5E1;
      border-radius: 6px;
      font-size:15px;
      width:100%;
      box-sizing: border-box; 
    }

    .register-card button {
        width: 100%;
        padding: 12px;
        background-color: #283779;
        color: white;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        font-size: 16px;
    }   
    .register-card button:hover {
        background-color: #2e4b93;
    }

    .register-card .login-link {
        text-align: center;
        margin-top: 20px;
    }

    .register-card a {
        color: #283779;
        text-decoration: none;
    }

    .register-card .errorlist {
        color: red;
        font-size: 13px;
    }
</style>
<div class="register-container">

  <div class="register-card">
    <h2>Student Registration</h2>
    <form method="POST">
      {% csrf_token %}

      {{ form.as_p }}
      <button type="submit">Create Account</button>
    </form>

    <p class="login-link">
      Already have an account?
      <a href="{% url 'login' %}">Login</a>
    </p>
  </div>
</div>
{% endblock %}
