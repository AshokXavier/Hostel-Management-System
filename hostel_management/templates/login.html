{% extends 'base.html' %}

{% block title %}Login - Stay Mate{% endblock %}

{% block content %}

<style>

    .login-container {
        min-height: 75vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 40px 20px;
    }

    .login-card {
        background-color: #FFFFFF;
        width: 100%;
        max-width: 420px;
        padding: 35px;
        border-radius: 12px;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
    }

    .login-card h2 {
        text-align: center;
        color: #324f97;
        margin-top: 0;
        margin-bottom: 25px;
    }

    .login-card form p {
        display: flex;
        flex-direction: column;
        gap: 7px;
        margin-bottom: 20px;
    }

    .login-card label {
        color: #334155;
        font-weight: 500;
    }

    .login-card input {
        padding: 12px;
        border: 1px solid #CBD5E1;
        border-radius: 6px;
        font-size: 15px;
        width: 100%;
        box-sizing: border-box;
        outline: none;
    }

    .login-card input:focus {
        border-color:#283779;
    }

    .login-card button {
        width: 100%;
        padding: 12px;
        background-color: #283779;
        color: white;
        border: none;
        border-radius: 6px;
        font-size: 16px;
        cursor: pointer;
    }

    .login-card button:hover {
        background-color: #263e7a;
    }

    .login-card .register-link {
        text-align: center;
        margin-top: 20px;
        color: #64748B;
    }

    .login-card a {
        color: #2e4b93;
        text-decoration: none;
        font-weight: 600;
    }

    .login-card a:hover {
        text-decoration: underline;
    }

    .login-card .errorlist {
        color: #DC2626;
        font-size: 13px;
    }

</style>


<div class="login-container">
  <div class="login-card">
    <h2>Welcome Back!</h2>
    <form method="POST">
      {% csrf_token %}
      {{ form.as_p}}
      <button type="submit">Login</button>
    </form>

    <p class="register-link">
      Don't have an account?
      <a href="{% url 'register' %}">Register here</a>
    </p>
  </div>
</div>
{% endblock %}
